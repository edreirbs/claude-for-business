# Publica el cuadernillo en GitHub Pages.
#
# La primera corrida configura Pages sola (enablement: true), así que no hay
# que tocar nada en Settings. A partir de ahí, cada push a main vuelve a
# publicar: editar una ficha de Repaso/ actualiza el sitio.
name: Publicar el cuadernillo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; no se cancela una que ya empezó.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # El sitio no se compila: se sube el repositorio tal cual, porque el
      # cuadernillo lee los .md de Repaso/ directamente desde el navegador.
      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
